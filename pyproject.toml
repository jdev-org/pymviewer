[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymviewer"
version = "1.0.2"
description = "Generate mviewer XML configurations from QGIS Server projects and WMS capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "PSC mviewer" },
    { name = "Gaetan Bruel", email = "gaetan.bruel@jdev.fr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent"
]
dependencies = []

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9,<10",
]

[project.urls]
Homepage = "https://github.com/jdev-org/pymviewer"
Repository = "https://github.com/jdev-org/pymviewer"
Issues = "https://github.com/jdev-org/pymviewer/issues"

[project.scripts]
pymviewer = "qgisxmviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
